[llm]
llama_cpp_host = "http://127.0.0.1:8080"
model = "unsloth/Qwen3.5-4B-GGUF:Q4_K_M"
context_length = 8192

[accounts]
greenmail.host = "127.0.0.1"
greenmail.port = 3143
greenmail.username = "alice"
greenmail.password = "alice1234"
greenmail.use_tls = false
greenmail.classifiers = ["simple_filter"]
greenmail.actions = [
    { type="copy", folder="anv_personal", condition="simple_filter.personal" },
    { type="copy", folder="anv_marketing", condition="simple_filter.spam" },
]

[classifiers.simple_filter]
prompt = """
<instructions>
Classify the email message into one of the pre-defined classes enclosed within <classes></classes> tags. Respond in JSON format with a single object containing "reasoning" and "class" properties.
</instructions>

<classes>
{{ classes }}
</classes>

{{ email_message }}
"""
classes.personal = "These are correspondance emails written by familiar acquaintances directly to the recipient"
classes.spam = "These are bulk emails trying to sell/advertise services or products"
