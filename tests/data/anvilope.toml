[llm]
ollama_host = "http://127.0.0.1:11434"
ollama_model = "mistral:latest"
context_length = 8192

[accounts]
greenmail.host = "127.0.0.1"
greenmail.port = 3143
greenmail.username = "alice"
greenmail.password = "alice1234"
greenmail.use_tls = false

[classifier]
prompt = """
<instructions>
Classify the email message into one of the pre-defined classes enclosed within <classes></classes> tags. Respond in JSON format with a single object containing "reasoning" and "class" properties.
</instructions>

<classes>
{{ classes }}
</classes>

{{ email_message }}
"""

[classes]
personal.prompt = "These are correspondance emails written by familiar acquaintances directly to the recipient"
personal.labels.greenmail = "anv_personal"

spam.prompt = "These are bulk emails trying to sell/advertise services or products"
spam.labels.greenmail = "anv_marketing"
