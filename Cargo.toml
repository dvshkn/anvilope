[package]
name = "anvilope"
version = "0.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
async-imap = { version = "0.10.4", features = ["runtime-tokio"], default-features = false }
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = "0.4.40"
clap = "4.5.36"
crossbeam = { version = "0.8.4", features = ["crossbeam-channel", "crossbeam-deque", "crossbeam-epoch", "crossbeam-queue"] }
ctrlc = "3.4.6"
env_logger = "0.11.8"
fallible-iterator = "0.3.0"
futures = "0.3.31"
home = "0.5.11"
log = "0.4.27"
minijinja = { version = "2.9.0", features = ["loader"] }
quoted_printable = "0.5.1"
r2d2 = "0.8.10"
r2d2_sqlite = "0.27.0"
regex = "1.11.1"
reqwest = { version = "0.12.15", features = ["json", "rustls-tls"] }
rusqlite = "0.34.0"
rustls-pki-types = "1.11.0"
rustls-platform-verifier = "0.5.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
stop-token = "0.7.0"
tokio = { version = "1.44.2", features = ["full"] }
tokio-rustls = { version = "0.26.2", features = ["logging", "tls12", "ring"], default-features = false }
toml = "0.8.20"
url = "2.5.4"

[dev-dependencies]
lettre = "0.11.18"
